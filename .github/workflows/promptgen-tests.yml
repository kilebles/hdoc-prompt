name: Prompts module tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-web.txt pytest
      - name: Compile check
        run: python -m compileall -q src/promptgen
      - name: Run tests
        run: python -m pytest -v
